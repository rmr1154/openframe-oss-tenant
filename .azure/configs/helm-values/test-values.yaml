# OpenFrame Helm Values - Test Environment
# Minimal resources for cost-effective testing

global:
  environment: test
  cloudProvider: azure
  domain: ""  # Set your domain here
  storageClass: managed-csi

# Common settings for all services
common:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Azure-specific configuration
  azure:
    enabled: true
    useManagedIdentity: true

# OpenFrame Gateway
openframe-gateway:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: ClusterIP
  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"

# OpenFrame API
openframe-api:
  replicaCount: 1
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 768Mi
  env:
    SPRING_PROFILES_ACTIVE: azure,test

# OpenFrame Stream
openframe-stream:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# OpenFrame Management
openframe-management:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# OpenFrame Config
openframe-config:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi

# OpenFrame Client
openframe-client:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# OpenFrame Frontend
openframe-frontend:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# External databases - use Azure managed services
mongodb:
  enabled: false  # Using Azure Cosmos DB

redis:
  enabled: false  # Using Azure Cache for Redis

kafka:
  enabled: false  # Using Azure Event Hubs

cassandra:
  enabled: true  # Self-managed, no Azure equivalent
  replicaCount: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  persistence:
    size: 10Gi

pinot:
  enabled: true  # Self-managed
  controller:
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  broker:
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  server:
    replicaCount: 1
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

zookeeper:
  enabled: true  # Required for Pinot
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

nats:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

# Monitoring - minimal for test
monitoring:
  prometheus:
    enabled: false
  grafana:
    enabled: false
  loki:
    enabled: false

# Integrated tools - disabled for test
integrated-tools:
  tactical-rmm:
    enabled: false
  meshcentral:
    enabled: false
  fleetmdm:
    enabled: false
  authentik:
    enabled: false
