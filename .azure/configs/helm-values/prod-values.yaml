# OpenFrame Helm Values - Production Environment
# High availability configuration with full features

global:
  environment: prod
  cloudProvider: azure
  domain: ""  # Set your production domain here
  storageClass: managed-csi-premium

# Common settings for all services
common:
  replicaCount: 2
  resources:
    requests:
      cpu: 350m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  azure:
    enabled: true
    useManagedIdentity: true

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: "{{ .Release.Name }}"
            topologyKey: topology.kubernetes.io/zone

# OpenFrame Gateway
openframe-gateway:
  replicaCount: 2
  resources:
    requests:
      cpu: 350m
      memory: 512Mi
    limits:
      cpu: 750m
      memory: 1Gi
  service:
    type: ClusterIP
  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "200m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      cert-manager.io/cluster-issuer: letsencrypt-prod
    tls:
      enabled: true
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

# OpenFrame API
openframe-api:
  replicaCount: 2
  resources:
    requests:
      cpu: 500m
      memory: 768Mi
    limits:
      cpu: 1000m
      memory: 1536Mi
  env:
    SPRING_PROFILES_ACTIVE: azure,prod
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

# OpenFrame Stream
openframe-stream:
  replicaCount: 2
  resources:
    requests:
      cpu: 350m
      memory: 512Mi
    limits:
      cpu: 750m
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75

# OpenFrame Management
openframe-management:
  replicaCount: 2
  resources:
    requests:
      cpu: 350m
      memory: 512Mi
    limits:
      cpu: 750m
      memory: 1Gi

# OpenFrame Config
openframe-config:
  replicaCount: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

# OpenFrame Client
openframe-client:
  replicaCount: 2
  resources:
    requests:
      cpu: 350m
      memory: 512Mi
    limits:
      cpu: 750m
      memory: 1Gi

# OpenFrame Frontend
openframe-frontend:
  replicaCount: 2
  resources:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# External databases - use Azure managed services
mongodb:
  enabled: false  # Using Azure Cosmos DB with autoscale

redis:
  enabled: false  # Using Azure Cache for Redis Premium

kafka:
  enabled: false  # Using Azure Event Hubs Standard

cassandra:
  enabled: true
  replicaCount: 3
  resources:
    requests:
      cpu: 750m
      memory: 2Gi
    limits:
      cpu: 1500m
      memory: 4Gi
  persistence:
    size: 100Gi
    storageClass: managed-csi-premium

pinot:
  enabled: true
  controller:
    replicaCount: 2
    resources:
      requests:
        cpu: 350m
        memory: 768Mi
      limits:
        cpu: 1000m
        memory: 1536Mi
  broker:
    replicaCount: 2
    resources:
      requests:
        cpu: 350m
        memory: 768Mi
      limits:
        cpu: 1000m
        memory: 1536Mi
  server:
    replicaCount: 3
    resources:
      requests:
        cpu: 500m
        memory: 1536Mi
      limits:
        cpu: 1500m
        memory: 3Gi
    persistence:
      size: 50Gi
      storageClass: managed-csi-premium

zookeeper:
  enabled: true
  replicaCount: 3
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

nats:
  enabled: true
  replicaCount: 3
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 350m
      memory: 512Mi
  jetstream:
    enabled: true
    storage:
      size: 20Gi
      storageClass: managed-csi-premium

# Monitoring - full stack for production
monitoring:
  prometheus:
    enabled: true
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    retention: 30d
    persistence:
      size: 50Gi
  grafana:
    enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    persistence:
      enabled: true
      size: 10Gi
  loki:
    enabled: true
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 750m
        memory: 1Gi
    persistence:
      size: 100Gi

# Integrated tools - full suite for production
integrated-tools:
  tactical-rmm:
    enabled: true
    replicaCount: 2
  meshcentral:
    enabled: true
    replicaCount: 2
  fleetmdm:
    enabled: true
    replicaCount: 2
  authentik:
    enabled: true
    replicaCount: 2

# Network policies
networkPolicy:
  enabled: true

# Pod security
podSecurityPolicy:
  enabled: true
