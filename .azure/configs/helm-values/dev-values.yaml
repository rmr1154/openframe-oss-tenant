# OpenFrame Helm Values - Development Environment
# Balanced resources for active development

global:
  environment: dev
  cloudProvider: azure
  domain: ""  # Set your domain here
  storageClass: managed-csi

# Common settings for all services
common:
  replicaCount: 1
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      cpu: 750m
      memory: 768Mi

  azure:
    enabled: true
    useManagedIdentity: true

# OpenFrame Gateway
openframe-gateway:
  replicaCount: 1
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 768Mi
  service:
    type: ClusterIP
  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "100m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"

# OpenFrame API
openframe-api:
  replicaCount: 1
  resources:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      cpu: 750m
      memory: 1Gi
  env:
    SPRING_PROFILES_ACTIVE: azure,dev

# OpenFrame Stream
openframe-stream:
  replicaCount: 1
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 768Mi

# OpenFrame Management
openframe-management:
  replicaCount: 1
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 768Mi

# OpenFrame Config
openframe-config:
  replicaCount: 1
  resources:
    requests:
      cpu: 150m
      memory: 384Mi
    limits:
      cpu: 350m
      memory: 768Mi

# OpenFrame Client
openframe-client:
  replicaCount: 1
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 768Mi

# OpenFrame Frontend
openframe-frontend:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 350m
      memory: 384Mi

# External databases - use Azure managed services
mongodb:
  enabled: false  # Using Azure Cosmos DB

redis:
  enabled: false  # Using Azure Cache for Redis

kafka:
  enabled: false  # Using Azure Event Hubs

cassandra:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 400m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
  persistence:
    size: 20Gi

pinot:
  enabled: true
  controller:
    replicaCount: 1
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 750m
        memory: 1Gi
  broker:
    replicaCount: 1
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 750m
        memory: 1Gi
  server:
    replicaCount: 1
    resources:
      requests:
        cpu: 300m
        memory: 768Mi
      limits:
        cpu: 750m
        memory: 1536Mi

zookeeper:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 350m
      memory: 512Mi

nats:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  jetstream:
    enabled: true
    storage:
      size: 5Gi

# Monitoring - enabled for dev
monitoring:
  prometheus:
    enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    retention: 7d
  grafana:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
  loki:
    enabled: false  # Use Azure Log Analytics

# Integrated tools - selective for dev
integrated-tools:
  tactical-rmm:
    enabled: false
  meshcentral:
    enabled: false
  fleetmdm:
    enabled: false
  authentik:
    enabled: true
    replicaCount: 1
